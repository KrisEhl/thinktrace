[project]
name = "glassbox"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.28",
    "fastapi>=0.144.0",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-nebius>=0.1.3",
    "langchain-tavily>=0.2.18",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "sse-starlette>=3.5.0",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
